services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CarService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Port=5432;Database=carservice;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env faylida berilishi kerak (kamida 32 belgi)}
      Database__MigrateOnStartup: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  client:
    build: ./client
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
